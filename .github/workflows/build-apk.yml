name: Build and Release Signed APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Ensure Platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Unit Tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace

      - name: Calculate SHA-256 Checksum
        id: checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
            echo "SHA256=$SHA" >> $GITHUB_ENV
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "SHA-256: $SHA"
          else
            echo "Error: No APK found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-terminal-ai-v1.0.0-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Orbit Terminal AI v1.0.0
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Orbit Terminal AI v1.0.0 (Production Release)

            ### 🔐 Binary Integrity & Checksum
            - **Target Architecture**: `arm64-v8a` (64-bit ARM)
            - **Min Android SDK**: Android 8.0 (API 26+)
            - **SHA-256**:
            ```
            ${{ env.SHA256 }}
            ```

            ---

            ### 🌟 Key Features:
            - **🤖 Multi-Provider AI Chatbot**: Google Gemini, Groq, OpenRouter, and OpenAI with word-by-word streaming responses, code syntax highlighting & one-tap copy.
            - **⚙ Autonomous Linux Tool Calling**: AI can directly run shell commands inside the Linux environment via `run_command`, inspect command outputs, fix errors, and report results in chat.
            - **🐧 Built-in Debian arm64 Linux Environment**: Native PRoot sandboxed Debian rootfs inside app-private storage. Includes Node.js LTS, Python 3, pip, npm, git, curl, gh.
            - **⚡ Integrated CLI Agents**:
              - **Google Antigravity CLI**: Official browser OAuth flow with token capture and status verification.
              - **Claude Code**: Terminal npm agent.
              - **OpenAI Codex CLI**: Interactive terminal assistant.
            - **💻 Tabbed Terminal Emulator**: Multi-tab sessions, virtual keys bar (Ctrl, Alt, Tab, Esc, arrows, pipes).
            - **🔄 In-App Self Updater**: Direct GitHub Releases API integration with Android DownloadManager and FileProvider.
            - **🛡 Encrypted Security**: Sensitive API keys and tokens encrypted with Android Keystore (AES-256-GCM).
            - **📄 License**: GNU General Public License v3.0 (GPL-3.0).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
