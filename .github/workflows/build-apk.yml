name: Build and Release Signed APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Application and Run Tests
        id: build_step
        run: |
          mkdir -p /tmp/build_diagnostics
          exec > >(tee -a /tmp/build_diagnostics/run.log) 2>&1
          set -e

          echo "=== 1. Environment Info ==="
          java -version
          echo "ANDROID_HOME: $ANDROID_HOME"

          echo "=== 2. Download and Setup Standalone Gradle 8.11.1 ==="
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          export GRADLE_CMD="$PWD/gradle-8.11.1/bin/gradle"
          export PATH="$PWD/gradle-8.11.1/bin:$PATH"
          echo "$PWD/gradle-8.11.1/bin" >> $GITHUB_PATH

          echo "Generating genuine gradle wrapper..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          $GRADLE_CMD wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ls -la gradle/wrapper/

          echo "=== 3. Setup Keystore ==="
          mkdir -p keystore
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/release.jks
            echo "Decoded keystore from secrets."
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore keystore/release.jks \
              -alias orbit-release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass orbitpass123 \
              -dname "CN=OrbitTerminalAI, OU=Orbit, O=FlexbleSoftware, L=SanFrancisco, S=CA, C=US"
          fi
          ls -la keystore/

          echo "=== 4. Accept Android Licenses ==="
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          echo "=== 5. Assemble Release APK ==="
          export KEYSTORE_FILE="${{ github.workspace }}/keystore/release.jks"
          export KEYSTORE_PASSWORD="orbitpass123"
          export KEY_ALIAS="orbit-release"
          export KEY_PASSWORD="orbitpass123"

          $GRADLE_CMD :app:assembleRelease --stacktrace

          echo "=== 6. Run Unit Tests ==="
          $GRADLE_CMD :app:testReleaseUnitTest --stacktrace

          echo "=== 7. Build Completed Successfully ==="

      - name: Capture Failure Diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== WORKFLOW FAILED ==="
          DIAG_FILE="/tmp/build_diagnostics/run.log"
          if [ -f "$DIAG_FILE" ]; then
            tail -n 250 "$DIAG_FILE" > build_error.txt
          else
            echo "No log file found." > build_error.txt
          fi
          gh issue comment 1 --body-file build_error.txt || gh issue create --title "CI Failure [$(date -u +'%H:%M:%SZ')]" --body-file build_error.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build_error.txt
          git commit -m "ci: capture build error [skip ci]" || true
          git push origin main || true

      - name: Locate and Prepare Release APK
        id: prepare_apk
        run: |
          APK_FOUND=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_FOUND"
          mkdir -p release-artifacts
          TARGET_APK="release-artifacts/OrbitTerminalAI-v1.0.0-arm64-v8a.apk"
          cp "$APK_FOUND" "$TARGET_APK"
          SHA=$(sha256sum "$TARGET_APK" | awk '{print $1}')
          echo "SHA256=$SHA" >> $GITHUB_ENV
          echo "RELEASE_APK=$TARGET_APK" >> $GITHUB_ENV
          echo "SHA-256 Checksum: $SHA"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitTerminalAI-v1.0.0-arm64-v8a
          path: ${{ env.RELEASE_APK }}
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Orbit Terminal AI v1.0.0
          files: ${{ env.RELEASE_APK }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 Orbit Terminal AI v1.0.0 (Production Release)

            ### 🔐 Binary Integrity & Checksum
            - **Target Architecture**: `arm64-v8a` (64-bit ARM)
            - **Min Android SDK**: Android 8.0 (API 26+)
            - **SHA-256 Checksum**:
            ```
            ${{ env.SHA256 }}
            ```

            ---

            ### 🌟 Key Features:
            - **🤖 Multi-Provider AI Chatbot**: Google Gemini, Groq, OpenRouter, and OpenAI with word-by-word streaming responses, code syntax highlighting & one-tap copy.
            - **⚙ Autonomous Linux Tool Calling**: AI can directly run shell commands inside the Linux environment via `run_command`, inspect command outputs, fix errors, and report results in chat.
            - **🐧 Built-in Debian arm64 Linux Environment**: Sandboxed Debian rootfs via native PRoot inside app-private storage. Includes Node.js LTS, Python 3, pip, npm, git, curl, gh.
            - **⚡ Integrated CLI Agents**:
              - **Google Antigravity CLI**: Official browser OAuth flow with token capture and status verification.
              - **Claude Code**: Terminal npm agent.
              - **OpenAI Codex CLI**: Interactive terminal assistant.
            - **💻 Tabbed Terminal Emulator**: Multi-tab sessions, virtual keys bar (Ctrl, Alt, Tab, Esc, arrows, pipes).
            - **🔄 In-App Self Updater**: Direct GitHub Releases API integration with Android DownloadManager and FileProvider.
            - **🛡 Encrypted Security**: Sensitive API keys and tokens encrypted with Android Keystore (AES-256-GCM).
            - **📄 License**: GNU General Public License v3.0 (GPL-3.0).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
