name: Build and Release Signed APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Building signed release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building unsigned/assembleDebug for validation..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Calculate SHA-256 Checksum
        id: checksum
        run: |
          APK_PATH=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
            echo "SHA256=$SHA" >> $GITHUB_ENV
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "SHA-256: $SHA"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: env.APK_PATH != ''
        with:
          name: orbit-terminal-ai-apk
          path: ${{ env.APK_PATH }}
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.APK_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          body: |
            ## Orbit Terminal AI Release ${{ github.ref_name }}

            ### Checksum (SHA-256)
            ```
            ${{ env.SHA256 }}
            ```

            ### Features:
            - Full-featured AI Chatbot (Gemini, Groq, OpenRouter, OpenAI) with streaming and tools
            - Built-in Debian arm64 Linux environment powered by proot
            - Integrated CLI Agents (Antigravity CLI, Claude Code, OpenAI Codex CLI)
            - Terminal emulator with tab management and virtual key bar
            - In-app automatic update manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
